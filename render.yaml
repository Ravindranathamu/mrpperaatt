# Render Blueprint for the Mr Paint Srilanka attendance app.
#
# In Render: New + -> Blueprint -> connect this repository -> Apply.
# Render prompts for the values marked sync: false. Enter them in the
# dashboard; never commit the Neon password, admin password, or session secret.
services:
  - type: web
    name: mrpp-attendance
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COMPANY_NAME
        value: Mr Paint Srilanka
      - key: BRANCH_NAME
        value: Peradeniya
      - key: COPYRIGHT_NAME
        value: RavSOFT
      - key: CONTACT_PHONE
        value: "+94755756803"
      - key: CONTACT_EMAIL
        value: ravindranath@hotmail.co.uk
      - key: TIMEZONE
        value: Asia/Colombo
      - key: WORK_START
        value: "07:00"
      - key: WORK_END
        value: "16:00"
      - key: NIGHT_SHIFT_START
        value: "16:00"
      - key: GRACE_MINUTES
        value: "10"
      - key: WORK_DAYS
        value: "1,2,3,4,5"
      - key: PUNCH_COOLDOWN_SECONDS
        value: "45"
      - key: OPEN_SHIFT_HOURS
        value: "20"
      - key: ALLOWED_RADIUS_METERS
        value: "75"
      - key: MAX_GPS_ACCURACY_METERS
        value: "250"
      - key: ALLOW_SELF_REGISTRATION
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      # Prompted once when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OFFICE_LAT
        sync: false
      - key: OFFICE_LNG
        sync: false
      # Generated by Render; rotating it signs every admin and employee out.
      - key: SESSION_SECRET
        generateValue: true
